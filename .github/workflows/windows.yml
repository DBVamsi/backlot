# Does Backlot run where the default text encoding is not UTF-8?
#
# windows-latest is the one runner whose locale encoding is cp1252: a file opened without
# encoding="utf-8" decodes with it, and the bundled schemas then fail to load before any command
# runs. The Linux suite under PYTHONWARNDEFAULTENCODING=1 (ci.yml) refuses such an open wherever a
# test reaches it; this job is the proof on the platform itself, with PYTHONUTF8 unset. A pull
# request runs the README's first command and the test files that read and write Backlot's own
# files — a fraction of the suite — and the whole suite runs weekly. Pinned below Python 3.15,
# where UTF-8 mode becomes the default (PEP 686) and the job would prove nothing.
name: Windows

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 02:00 UTC, 11:00 in Seoul.
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --extra dev --locked --python 3.14
      - name: The README's first command
        run: uv run --no-sync python -m backlot import backlot/data/hello.jsonl
      - name: The test files that read and write Backlot's own files
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: >
          uv run --no-sync pytest -rs
          tests/test_cli.py tests/test_server.py tests/test_schema.py tests/test_docs.py
          tests/test_importer_erb.py tests/test_acl.py tests/test_fidelity.py tests/test_packaging.py
      - name: The whole suite
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: uv run --no-sync pytest -rs
